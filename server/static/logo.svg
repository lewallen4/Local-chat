<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <style>
      .bold { stroke: #000; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .fine { stroke: #000; fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-width: 1.5; }
      .thick { stroke: #000; fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-width: 3.5; }
      .dot { fill: #000; }
      .heavy-dot { fill: #000; }
    </style>
  </defs>

  <!-- Outer double ring (goetic containment, tattoo style) -->
  <circle cx="50" cy="50" r="46" class="bold" stroke-width="3.8"/>
  <circle cx="50" cy="50" r="43" class="bold" stroke-width="1.8" opacity="0.6"/>

  <!-- Second inner ring with deliberate breaks (zzizzi boy style) -->
  <path d="M 50,12 A 38,38 0 1,1 22,31" class="bold" stroke-width="2.5"/>
  <path d="M 78,69 A 38,38 0 1,1 50,88" class="bold" stroke-width="2.5"/>

  <!-- Central hexagram foundation - bold, heavy lines -->
  <polygon points="50,8 78,30 78,70 50,92 22,70 22,30" class="thick"/>
  <polygon points="50,92 78,70 78,30 50,8 22,30 22,70" class="thick"/>

  <!-- Core sigil glyph - overlapping paths reminiscent of Goetia #1 (Baal) and #29 (Astaroth) -->
  <!-- Vertical spine with branching -->
  <line x1="50" y1="8" x2="50" y2="92" class="thick" stroke-width="3.2"/>

  <!-- Intersecting diagonals forming an "X" but with curves -->
  <path d="M 22,30 Q 50,50 78,70" class="thick" stroke-width="3"/>
  <path d="M 22,70 Q 50,50 78,30" class="thick" stroke-width="3"/>

  <!-- Horizontal bar with loops (common goetic motif) -->
  <path d="M 22,50 C 30,40 35,50 40,50" class="bold" stroke-width="2.8"/>
  <line x1="40" y1="50" x2="60" y2="50" class="bold" stroke-width="2.8"/>
  <path d="M 60,50 C 65,50 70,40 78,50" class="bold" stroke-width="2.8"/>

  <!-- Lower arc / crescent element -->
  <path d="M 35,75 Q 50,68 65,75" class="bold" stroke-width="2.5"/>

  <!-- Upper arcs (like inverted horns / crown) -->
  <path d="M 40,20 Q 50,8 60,20" class="bold" stroke-width="2.8"/>
  <path d="M 35,25 Q 50,14 65,25" class="bold" stroke-width="2.2"/>

  <!-- Small connecting lines (creates density) -->
  <line x1="22" y1="30" x2="28" y2="36" class="fine"/>
  <line x1="78" y1="30" x2="72" y2="36" class="fine"/>
  <line x1="22" y1="70" x2="28" y2="64" class="fine"/>
  <line x1="78" y1="70" x2="72" y2="64" class="fine"/>

  <!-- Cross marks at cardinal points (classic goetic) -->
  <!-- Top -->
  <line x1="46" y1="10" x2="54" y2="16" class="bold" stroke-width="2.2"/>
  <line x1="54" y1="10" x2="46" y2="16" class="bold" stroke-width="2.2"/>
  <!-- Bottom -->
  <line x1="46" y1="84" x2="54" y2="90" class="bold" stroke-width="2.2"/>
  <line x1="54" y1="84" x2="46" y2="90" class="bold" stroke-width="2.2"/>

  <!-- Stippling / dot work detail (zzizzi boy signature) -->
  <circle cx="50" cy="50" r="5.5" class="heavy-dot"/>
  <circle cx="50" cy="23" r="2.5" class="dot"/>
  <circle cx="50" cy="77" r="2.5" class="dot"/>
  <circle cx="27" cy="50" r="2.5" class="dot"/>
  <circle cx="73" cy="50" r="2.5" class="dot"/>

  <!-- Additional orbital nodes -->
  <circle cx="35" cy="35" r="1.8" class="dot"/>
  <circle cx="65" cy="35" r="1.8" class="dot"/>
  <circle cx="35" cy="65" r="1.8" class="dot"/>
  <circle cx="65" cy="65" r="1.8" class="dot"/>

  <!-- Decorative stippled accents around outer ring -->
  <circle cx="50" cy="5" r="1.5" class="dot"/>
  <circle cx="50" cy="95" r="1.5" class="dot"/>
  <circle cx="5" cy="50" r="1.5" class="dot"/>
  <circle cx="95" cy="50" r="1.5" class="dot"/>

  <!-- Small triangular notches (tattoo detail) -->
  <path d="M 88,20 L 92,22 L 90,26 Z" class="dot"/>
  <path d="M 12,20 L 8,22 L 10,26 Z" class="dot"/>
  <path d="M 88,80 L 92,78 L 90,74 Z" class="dot"/>
  <path d="M 12,80 L 8,78 L 10,74 Z" class="dot"/>
</svg>