<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <style>
      .black { stroke: #000000; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .teal { stroke: #5BCEFA; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .teal-fill { fill: #5BCEFA; }
    </style>
  </defs>

  <!-- Outer boundary: simple square (brutalist containment) -->
  <rect x="8" y="8" width="84" height="84" class="black" stroke-width="4"/>

  <!-- Central vertical axis -->
  <line x1="50" y1="8" x2="50" y2="92" class="black" stroke-width="4"/>

  <!-- Central horizontal axis -->
  <line x1="8" y1="50" x2="92" y2="50" class="black" stroke-width="4"/>

  <!-- Diagonal axes forming an "X" -->
  <line x1="8" y1="8" x2="92" y2="92" class="black" stroke-width="4"/>
  <line x1="92" y1="8" x2="8" y2="92" class="black" stroke-width="4"/>

  <!-- Teal accent: central diamond -->
  <polygon points="50,30 70,50 50,70 30,50" class="teal" stroke-width="4"/>

  <!-- Teal accent: four dots at cardinal points -->
  <circle cx="50" cy="22" r="3" class="teal-fill"/>
  <circle cx="50" cy="78" r="3" class="teal-fill"/>
  <circle cx="22" cy="50" r="3" class="teal-fill"/>
  <circle cx="78" cy="50" r="3" class="teal-fill"/>

  <!-- Small teal lines at intercardinal corners -->
  <line x1="20" y1="20" x2="30" y2="20" class="teal" stroke-width="3"/>
  <line x1="20" y1="20" x2="20" y2="30" class="teal" stroke-width="3"/>
  <line x1="80" y1="20" x2="70" y2="20" class="teal" stroke-width="3"/>
  <line x1="80" y1="20" x2="80" y2="30" class="teal" stroke-width="3"/>
  <line x1="20" y1="80" x2="30" y2="80" class="teal" stroke-width="3"/>
  <line x1="20" y1="80" x2="20" y2="70" class="teal" stroke-width="3"/>
  <line x1="80" y1="80" x2="70" y2="80" class="teal" stroke-width="3"/>
  <line x1="80" y1="80" x2="80" y2="70" class="teal" stroke-width="3"/>
</svg>