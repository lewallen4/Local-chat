<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <style>
      .sigil-line { stroke: #000; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .sigil-dot { fill: #000; }
      .sigil-text { font-family: 'Lexend Light', 'Lexend', 'Inter', sans-serif; font-weight: 300; font-size: 7px; fill: #000; text-anchor: middle; letter-spacing: 2px; }
    </style>
  </defs>

  <!-- Outer boundary circle (subtle) -->
  <circle cx="50" cy="50" r="44" class="sigil-line" stroke-width="1.5" opacity="0.4"/>

  <!-- Central geometric star / octagram motif -->
  <polygon points="50,12 61,34 86,34 67,48 74,73 50,59 26,73 33,48 14,34 39,34" class="sigil-line" stroke-width="2.2"/>

  <!-- Inner intersecting lines forming a sigil core -->
  <line x1="26" y1="73" x2="74" y2="73" class="sigil-line" stroke-width="1.8"/>
  <line x1="33" y1="48" x2="67" y2="48" class="sigil-line" stroke-width="1.8"/>
  <line x1="14" y1="34" x2="86" y2="34" class="sigil-line" stroke-width="1.8"/>

  <!-- Central node / focal point -->
  <circle cx="50" cy="50" r="5" class="sigil-dot"/>

  <!-- Subtle "AI" ligature as part of the sigil -->
  <text x="50" y="90" class="sigil-text">AI</text>

  <!-- Bottom connection line -->
  <line x1="46" y1="87" x2="46" y2="82" class="sigil-line" stroke-width="1.2"/>
  <line x1="54" y1="87" x2="54" y2="82" class="sigil-line" stroke-width="1.2"/>

  <!-- Top anchor points -->
  <line x1="50" y1="12" x2="50" y2="18" class="sigil-line" stroke-width="1.5"/>
  <circle cx="50" cy="11" r="2" class="sigil-dot"/>
</svg>