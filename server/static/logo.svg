<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <style>
      .black-fill { fill: #000000; }
      .teal-fill { fill: #5BCEFA; }
    </style>
  </defs>

  <!-- Outer black diamond (brutalist anchor) -->
  <polygon points="50,5 95,50 50,95 5,50" class="black-fill"/>

  <!-- Teal accent: thin diamond-shaped border/cutout between outer and inner -->
  <polygon points="50,16 84,50 50,84 16,50" class="teal-fill"/>

  <!-- Inner black diamond (sharp core, same shape as outer) -->
  <polygon points="50,24 76,50 50,76 24,50" class="black-fill"/>
</svg>