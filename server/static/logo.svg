<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <style>
      .sigil-line { stroke: #000; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .sigil-dot { fill: #000; }
    </style>
  </defs>

  <!-- Outer circle (typical goetic containment) -->
  <circle cx="50" cy="50" r="45" class="sigil-line" stroke-width="3.5" opacity="0.5"/>

  <!-- Central hexagram / star of solomon - classic goetic foundation -->
  <polygon points="50,10 76,28 76,72 50,90 24,72 24,28" class="sigil-line" stroke-width="3.2"/>
  <polygon points="50,90 76,72 76,28 50,10 24,28 24,72" class="sigil-line" stroke-width="3.2"/>

  <!-- Sigil core - intersecting lines forming a unique glyph -->
  <line x1="24" y1="28" x2="76" y2="72" class="sigil-line" stroke-width="2.8"/>
  <line x1="24" y1="72" x2="76" y2="28" class="sigil-line" stroke-width="2.8"/>

  <!-- Distinctive goetic-style loops/arcs at cardinal points -->
  <!-- Top arc -->
  <path d="M 40,18 Q 50,6 60,18" class="sigil-line" stroke-width="2.5"/>
  <!-- Bottom arc -->
  <path d="M 40,82 Q 50,94 60,82" class="sigil-line" stroke-width="2.5"/>
  <!-- Left arc -->
  <path d="M 18,40 Q 6,50 18,60" class="sigil-line" stroke-width="2.5"/>
  <!-- Right arc -->
  <path d="M 82,40 Q 94,50 82,60" class="sigil-line" stroke-width="2.5"/>

  <!-- Cross marks (classic goetic element) at intercardinal points -->
  <!-- Top-right -->
  <line x1="68" y1="18" x2="72" y2="22" class="sigil-line" stroke-width="2.2"/>
  <line x1="72" y1="18" x2="68" y2="22" class="sigil-line" stroke-width="2.2"/>
  <!-- Bottom-right -->
  <line x1="68" y1="78" x2="72" y2="82" class="sigil-line" stroke-width="2.2"/>
  <line x1="72" y1="78" x2="68" y2="82" class="sigil-line" stroke-width="2.2"/>
  <!-- Bottom-left -->
  <line x1="28" y1="78" x2="32" y2="82" class="sigil-line" stroke-width="2.2"/>
  <line x1="32" y1="78" x2="28" y2="82" class="sigil-line" stroke-width="2.2"/>
  <!-- Top-left -->
  <line x1="28" y1="18" x2="32" y2="22" class="sigil-line" stroke-width="2.2"/>
  <line x1="32" y1="18" x2="28" y2="22" class="sigil-line" stroke-width="2.2"/>

  <!-- Central node (anchor of the sigil) -->
  <circle cx="50" cy="50" r="4.5" class="sigil-dot"/>

  <!-- Orbital nodes (common in both goetia and modern iconography) -->
  <circle cx="50" cy="14" r="3" class="sigil-dot"/>
  <circle cx="50" cy="86" r="3" class="sigil-dot"/>
  <circle cx="14" cy="50" r="3" class="sigil-dot"/>
  <circle cx="86" cy="50" r="3" class="sigil-dot"/>
</svg>