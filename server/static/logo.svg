<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <style>
      .black-fill { fill: #000000; }
      .teal-fill { fill: #5BCEFA; }
    </style>
  </defs>

  <!-- Central solid black hexagon (grounding, tech, strength) -->
  <polygon points="50,12 80,35 80,65 50,88 20,65 20,35" class="black-fill"/>

  <!-- Teal diagonal slash: precision, forward motion, AI -->
  <polygon points="50,28 72,50 50,72 28,50" class="teal-fill"/>

  <!-- Refined teal core dot for balance -->
  <circle cx="50" cy="50" r="4" fill="#FFFFFF"/>
</svg>