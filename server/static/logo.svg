<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 200" width="100" height="200">
  <defs>
    <style>
      .black-fill { fill: #000000; }
      .teal-fill { fill: #5BCEFA; }
    </style>
  </defs>

  <!-- Outer black pentagon: tall, sharp, brutalist -->
  <!-- Top point, then right side, bottom right, bottom left, left side -->
  <polygon points="50,8 80,40 72,192 28,192 20,40" class="black-fill"/>

  <!-- Teal diamond nested inside the pentagon -->
  <polygon points="50,48 68,100 50,152 32,100" class="teal-fill"/>

  <!-- Core: tiny black pentagon (same shape as outer) -->
  <polygon points="50,88 56,98 54,108 46,108 44,98" class="black-fill"/>
</svg>