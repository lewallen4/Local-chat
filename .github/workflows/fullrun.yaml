name: Clean Install Deploy

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:24.04
    timeout-minutes: 350

    steps:
    - name: Bootstrap container
      env:
        DEBIAN_FRONTEND: noninteractive
        TZ: UTC
      run: |
        # Ubuntu 24.04 container is genuinely bare — just needs sudo and git
        apt-get update -qq
        apt-get install -y sudo git curl wget 2>/dev/null
        echo "✅ Container ready — $(cat /etc/os-release | grep PRETTY_NAME | cut -d'"' -f2)"

    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Clean runner environment
      run: |
        echo "🧹 Resetting runner to clean state..."

        # Remove cmake and any /usr/local/bin tools the runner installed
        # outside of apt (these are safe to delete)
        sudo rm -f /usr/local/bin/cmake
        sudo rm -f /usr/local/bin/g++ /usr/local/bin/gcc /usr/local/bin/c++
        sudo find /usr/local/bin -name "g++*" -o -name "gcc*" 2>/dev/null | sudo xargs rm -f 2>/dev/null || true
        sudo rm -f /usr/local/bin/python3* /usr/local/bin/pip3*

        # Purge cmake and build-essential from apt — these are safe to remove
        sudo apt-get remove -y --purge cmake build-essential 2>/dev/null || true
        sudo apt-get autoremove -y --purge 2>/dev/null || true

        # For python3/pip3/g++ — Ubuntu won't let us fully remove them because
        # of system dependencies. Instead mark them so apt treats our install
        # as a clean reinstall.
        sudo apt-get purge -y python3.12 python3.12-venv python3.12-dev 2>/dev/null || true

        # Clear venvs from prior runs — this is the most important part
        rm -rf "$HOME/.skyeai-venv" "$HOME/.localchat-venv" "$HOME/.guildchat-venv"

        # Rehash shell cache
        hash -r 2>/dev/null || true

        echo ""
        echo "── Verification ──────────────────────────────"
        command -v cmake    && echo "⚠️  cmake still present at $(command -v cmake)"    || echo "✅ cmake removed"
        command -v g++      && echo "⚠️  g++ still present at $(command -v g++)"        || echo "✅ g++ removed"
        test -d "$HOME/.skyeai-venv" && echo "⚠️  venv still present" || echo "✅ venv cleared"
        echo "──────────────────────────────────────────────"
        echo "✅ Runner prepped — setup.sh will do a clean install"

    - name: Setup environment
      env:
        DEBIAN_FRONTEND: noninteractive
        TZ: UTC
      run: |
         echo "################"
         echo " "
         bash setup.sh

    - name: Pull model
      run: bash model_pull.sh

    - name: Setup ngrok
      run: |
        wget -q https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-linux-amd64.tgz
        sudo tar xzf ngrok-v3-stable-linux-amd64.tgz -C /usr/local/bin
        rm ngrok-v3-stable-linux-amd64.tgz
        ngrok config add-authtoken ${{ secrets.NGROK_AUTH_TOKEN }}
        pkill ngrok 2>/dev/null || true
        sleep 1
        ngrok http 8000 --log=stdout > /tmp/ngrok.log 2>&1 &
        sleep 5
        NGROK_URL=$(curl -s http://localhost:4040/api/tunnels \
          | python3 -c "import sys,json; print(json.load(sys.stdin)['tunnels'][0]['public_url'])")
        echo "NGROK_URL=$NGROK_URL" >> $GITHUB_ENV
        echo "================================================"
        echo "✅ NGROK TUNNEL ESTABLISHED"
        echo "🌐 Public URL: $NGROK_URL"
        echo "================================================"

    - name: Launch server + keep alive
      run: |
        echo "🚀 Starting Skye-AI..."
        echo "📡 Access via: ${{ env.NGROK_URL }}"

        bash run.sh --lan &
        SERVER_PID=$!

        # Wait for server to come up
        for i in $(seq 1 30); do
          if curl -s http://localhost:8000 > /dev/null 2>&1; then
            echo "✅ Server is up (attempt $i)"
            break
          fi
          echo "  ⏳ attempt $i/30..."
          sleep 2
        done

        echo ""
        echo "================================================"
        echo "🌐 Skye-AI is live at: ${{ env.NGROK_URL }}"
        echo "================================================"

        # Keepalive loop — restart server or tunnel if either dies
        while true; do
          sleep 60
          echo "[$(date '+%H:%M:%S')] Running — ${{ env.NGROK_URL }}"

          if ! curl -s http://localhost:4040/api/tunnels > /dev/null 2>&1; then
            echo "⚠️  ngrok tunnel lost — restarting..."
            pkill ngrok 2>/dev/null || true
            sleep 1
            ngrok http 8000 --log=stdout > /tmp/ngrok.log 2>&1 &
            sleep 5
            NEW_URL=$(curl -s http://localhost:4040/api/tunnels \
              | python3 -c "import sys,json; print(json.load(sys.stdin)['tunnels'][0]['public_url'])" 2>/dev/null || echo "unknown")
            echo "🔄 New URL: $NEW_URL"
          fi

          if ! kill -0 $SERVER_PID 2>/dev/null; then
            echo "⚠️  Server died — restarting..."
            bash run.sh --lan &
            SERVER_PID=$!
            echo "🔄 Server restarted (PID $SERVER_PID)"
          fi
        done
